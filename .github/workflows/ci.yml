name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-automation:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test publishing and Gitee synchronization
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test immutable release-tag creation
        run: node --test scripts/test-create-release-tag.mjs
      - name: Test verified-artifact release recovery boundaries
        run: node --test scripts/test-release-recovery.mjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - macos-15-intel
          - windows-2025
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm ci
      - run: npm run version:check
      - run: npm run test:branding
      - run: npm run test:licenses
      - run: npm run test:theme
      - run: npm run test:ui
      - run: npm run test:update
      - run: npm run test:rules
      - run: npm run test:programs
      - run: npm run test:routing
      - run: npm run test:subscriptions
      - run: npm run core:prepare
      - run: npm run test:core
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          SERYLANE_NATIVE_TRAY_SNAPSHOT_DIR: ${{ runner.temp }}/native-tray
      - name: Verify version-independent Windows application binding
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-app-binding.ps1
      - name: Retain native tray rendering evidence
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: native-tray-${{ matrix.os }}
          path: ${{ runner.temp }}/native-tray
          if-no-files-found: warn
