name: Release bundles

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to publish or repair; empty builds the selected ref without publishing
        required: false
        type: string
      publish_current:
        description: Build trusted main, verify every platform, then create its version tag and publish
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-bundles-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      tag: ${{ steps.resolve.outputs.tag }}
      create_tag: ${{ steps.resolve.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve one immutable source commit for every platform
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
          PUBLISH_CURRENT: ${{ inputs.publish_current }}
        shell: bash
        run: |
          node scripts/version.mjs --release-ready
          if [ "$PUBLISH_CURRENT" = "true" ]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/main" ] || [ -n "$RELEASE_TAG" ]; then
              echo 'Publishing current source requires trusted main and no separate release_tag.'
              exit 1
            fi
            RELEASE_TAG="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
            echo 'create_tag=true' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/version.mjs --tag "$RELEASE_TAG"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  bundle:
    needs: source
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: macos-aarch64
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - os: macos-15-intel
            artifact: macos-x64
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
              src-tauri/target/release/bundle/macos/*.app.tar.gz*
          - os: windows-2025
            artifact: windows-x64
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.sig
              src-tauri/target/release/bundle/nsis/*.sig
          - os: windows-11-arm
            artifact: windows-arm64
            paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.sig
              src-tauri/target/release/bundle/nsis/*.sig
          - os: ubuntu-24.04
            artifact: linux-x64
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.sig
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: release-${{ matrix.artifact }}
          cache-on-failure: true
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils
      - run: npm ci
      - run: npm run version:check
      - name: Require matching release tag
        if: needs.source.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
        run: node scripts/version.mjs --tag "$RELEASE_TAG"
        shell: bash
      - run: npm run test:branding
      - run: npm run test:licenses
      - run: npm run test:theme
      - run: npm run test:ui
      - run: npm run test:update
      - run: npm run test:rules
      - run: npm run test:programs
      - run: npm run test:routing
      - run: npm run test:subscriptions
      - run: npm run core:prepare
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          SERYLANE_NATIVE_TRAY_SNAPSHOT_DIR: ${{ runner.temp }}/native-tray
      - name: Verify version-independent Windows application binding
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-app-binding.ps1
      - name: Retain failed native tray rendering evidence
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          # Failed runs never reach publish. Successful runs retain exactly
          # the six installer artifacts consumed by the release publisher.
          name: failed-native-tray-${{ matrix.artifact }}
          path: ${{ runner.temp }}/native-tray
          if-no-files-found: warn
      - name: Build signed installers and updater artifacts
        id: signed_build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing TAURI_SIGNING_PRIVATE_KEY; refusing an unsigned release.'
            exit 1
          fi
          npm run tauri build
      - name: Verify Windows installers on disposable runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installers.ps1 -Architecture '${{ matrix.artifact == 'windows-arm64' && 'arm64' || 'x64' }}'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.signed_build.outcome == 'success' }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          # A failed installer gate may already have retained its build output.
          # Replace only this run's provisional platform artifact on a rerun.
          overwrite: true

  publish:
    needs: [source, bundle]
    if: github.repository == 'CMMUU/serylane' && needs.source.outputs.tag != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Test release publisher
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test scripts/test-create-release-tag.mjs
      - uses: actions/download-artifact@v4
        with:
          # A rerun can retain failure screenshots from its earlier attempt.
          # Only the six platform package directories enter signed publishing.
          pattern: '{macos,windows,linux}-*'
          path: ${{ runner.temp }}/release-artifacts
      - name: Create immutable version tag after every platform passed
        if: needs.source.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: node scripts/create-release-tag.mjs
      - name: Generate and verify compliance assets, then publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: >-
          python3 scripts/publish_github_release.py
          --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          --artifacts "$RUNNER_TEMP/release-artifacts"
          --output "$RUNNER_TEMP/release-assets" --apply
