name: Sync GitHub to Gitee

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_run:
    workflows: [Release bundles]
    types: [completed]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional published stable tag; latest-version retention always takes precedence
        required: false
        type: string
      dry_run:
        description: Preview retained versions, retirement targets and quota without any remote changes
        required: false
        type: boolean
        default: true
      runner:
        description: GitHub-hosted runner; use the other architecture to diagnose a stalled network route
        required: true
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
          - macos-14
      transfer_workers:
        description: Use one transfer to diagnose a congested upload route
        required: true
        type: choice
        default: '3'
        options:
          - '3'
          - '1'
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: gitee-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'CMMUU/serylane' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' || startsWith(github.event.workflow_run.head_branch, 'v')) &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    # Only trusted GitHub-hosted images already exercised by Serylane CI.
    # A macOS route is available if cross-region attachment uploads stall.
    runs-on: ${{ inputs.runner == 'macos-14' && 'macos-14' || inputs.runner == 'ubuntu-24.04' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    # Three bounded uploads may share a slow cross-region route. Leave room for
    # verification of the complete release; no hash/signature checks are skipped.
    timeout-minutes: 300
    steps:
      - name: Check out trusted default-branch synchronizer
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline synchronizer checks
        run: python3 -m unittest discover -s scripts -p 'test_*gitee*.py' -b
      - name: Synchronize to the checked Gitee repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_ASSET_HOSTS: ${{ vars.GITEE_ASSET_HOSTS }}
          GITEE_MAX_ASSET_BYTES: ${{ vars.GITEE_MAX_ASSET_BYTES }}
          GITEE_MAX_TOTAL_BYTES: ${{ vars.GITEE_MAX_TOTAL_BYTES }}
          GITEE_OTHER_ATTACHMENT_BYTES: ${{ vars.GITEE_OTHER_ATTACHMENT_BYTES }}
          SYNC_EVENT: ${{ github.event_name }}
          SYNC_RELEASE_TAG: ${{ github.event.release.tag_name }}
          SYNC_BUILD_REF: ${{ github.event.workflow_run.head_branch }}
          SYNC_REQUESTED_TAG: ${{ inputs.release_tag }}
          SYNC_DRY_RUN: ${{ inputs.dry_run }}
          SYNC_TRANSFER_WORKERS: ${{ inputs.transfer_workers == '1' && '1' || '3' }}
        shell: bash
        run: |
          # Explicitly approved retention: keep the newest stable release on
          # Gitee; GitHub history, release metadata and all Git tags stay intact.
          args=(--repo serylane --work-dir "$RUNNER_TEMP/gitee-sync" --keep-latest-releases 1 --transfer-workers "$SYNC_TRANSFER_WORKERS" --sync-display-name --migrate-legacy-path)
          if [ "$SYNC_DRY_RUN" != "true" ]; then
            args+=(--apply)
          fi
          case "$SYNC_EVENT" in
            push)
              args+=(--scope refs)
              ;;
            release)
              args+=(--scope all --release-tag "$SYNC_RELEASE_TAG")
              ;;
            workflow_run)
              if [[ "$SYNC_BUILD_REF" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                args+=(--scope all --release-tag "$SYNC_BUILD_REF")
              else
                # A manually repaired release may run from main while checking
                # out an immutable tag. Preserve automatic attachment sync.
                args+=(--scope all)
              fi
              ;;
            workflow_dispatch)
              args+=(--scope all)
              if [ -n "$SYNC_REQUESTED_TAG" ]; then
                args+=(--release-tag "$SYNC_REQUESTED_TAG")
              fi
              ;;
            *)
              # Audit protected history too, but never refill expired binaries.
              args+=(--scope all)
              ;;
          esac
          python3 scripts/sync_gitee.py "${args[@]}"
  website:
    name: Synchronize and verify official website
    needs: sync
    if: inputs.dry_run != true
    uses: ./.github/workflows/website.yml
    with:
      deploy: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
